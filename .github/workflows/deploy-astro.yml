name: Build and deploy Astro site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Verify generated website
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/about/index.html
          test -f dist/contact/index.html
          test -f dist/tools/index.html
          test -f dist/tools/merge-pdf/index.html
          test -f dist/tools/split-pdf/index.html
          test -f dist/tools/pdf-to-word/index.html
          test -f dist/tools/pdf-page-numbers/index.html
          test -f dist/privacy/index.html
          test -f dist/terms/index.html
          test -f dist/workspace/index.html
          test -f dist/pdf-editor.html
          test -f dist/ads.txt
          test -f dist/googledd5a51d8de510678.html
          test -f dist/CNAME
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/assets/js/analytics.js
          test -f dist/assets/js/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
