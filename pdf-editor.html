<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="محرر PDF مجاني من World PDF: ارفع PDF أو امسح صورة بالكاميرا، أضف نصاً ورسومات وصوراً، ثم احفظ وحمّل الملف."><title>محرر PDF بالكاميرا والرفع — World PDF</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head>
<body class="min-h-screen bg-slate-950 text-white"><header class="border-b border-slate-800"><div class="mx-auto max-w-6xl px-4 py-5 flex items-center justify-between"><div><a href="/" class="text-xl font-extrabold">World PDF</a><p class="text-sm text-slate-400">محرر PDF — عماد الدين لمراني</p></div><a href="/" class="rounded-lg border border-slate-700 px-4 py-2">العودة</a></div></header>
<main class="mx-auto max-w-6xl px-4 py-8"><section class="rounded-3xl border border-slate-800 bg-slate-900 p-6"><h1 class="text-3xl font-extrabold">تعديل ملف PDF مباشرة</h1><p class="mt-2 text-slate-400">ارفع PDF، أو صوّر مستنداً بالكاميرا، ثم أضف نصاً أو رسماً أو صورة واحفظ النتيجة على جهازك.</p>
<div class="mt-6 grid gap-3 sm:grid-cols-3"><label class="cursor-pointer rounded-xl bg-red-600 px-5 py-3 text-center font-bold hover:bg-red-500">رفع PDF<input id="pdfInput" type="file" accept="application/pdf" class="hidden"></label><label class="cursor-pointer rounded-xl border border-slate-700 px-5 py-3 text-center font-bold hover:bg-slate-800">مسح بالكاميرا<input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden"></label><label class="cursor-pointer rounded-xl border border-slate-700 px-5 py-3 text-center font-bold hover:bg-slate-800">رفع صورة<input id="imageInput" type="file" accept="image/*" class="hidden"></label></div>
<div class="mt-6 flex flex-wrap gap-2"><button id="addText" class="rounded-lg border border-slate-700 px-4 py-2 disabled:opacity-40" disabled>إضافة نص</button><button id="draw" class="rounded-lg border border-slate-700 px-4 py-2 disabled:opacity-40" disabled>الرسم على الصفحة</button><button id="save" class="rounded-lg bg-emerald-600 px-5 py-2 font-bold disabled:opacity-40" disabled>حفظ وتحميل PDF</button><button id="clear" class="rounded-lg border border-slate-700 px-4 py-2 disabled:opacity-40" disabled>مسح التعديلات</button></div>
<p id="status" class="mt-4 text-sm text-slate-400">اختر ملفاً للبدء.</p></section>
<section id="editor" class="mt-6 hidden rounded-3xl border border-slate-800 bg-slate-900 p-4"><div id="pages" class="space-y-8"></div></section></main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const state={pdfBytes:null,pages:[],active:null,draw:false};const $=id=>document.getElementById(id);function status(t){$('status').textContent=t}
async function imageToPdf(file){const bytes=new Uint8Array(await file.arrayBuffer());const pdf=await PDFLib.PDFDocument.create();let img;try{img=await pdf.embedJpg(bytes)}catch{img=await pdf.embedPng(bytes)}const s=img.scale(1);const p=pdf.addPage([s.width,s.height]);p.drawImage(img,{x:0,y:0,width:s.width,height:s.height});return await pdf.save()}
async function render(bytes){state.pdfBytes=bytes;state.pages=[];$('pages').innerHTML='';$('editor').classList.remove('hidden');const pdf=await pdfjsLib.getDocument({data:bytes}).promise;for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),vp=page.getViewport({scale:1.35});const wrap=document.createElement('div');wrap.className='relative mx-auto max-w-3xl overflow-hidden rounded-xl bg-white shadow-2xl';const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.className='block w-full h-auto';await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const overlay=document.createElement('canvas');overlay.width=vp.width;overlay.height=vp.height;overlay.className='absolute inset-0 h-full w-full';wrap.append(c,overlay);$('pages').append(wrap);state.pages.push({canvas:c,overlay,viewport:vp});overlay.addEventListener('pointerdown',e=>{if(!state.draw)return;const r=overlay.getBoundingClientRect();overlay.getContext('2d').lineWidth=3;overlay.getContext('2d').lineCap='round';overlay.getContext('2d').strokeStyle='#ef4444';overlay.getContext('2d').beginPath();overlay.getContext('2d').moveTo((e.clientX-r.left)*overlay.width/r.width,(e.clientY-r.top)*overlay.height/r.height);const move=ev=>{const x=(ev.clientX-r.left)*overlay.width/r.width,y=(ev.clientY-r.top)*overlay.height/r.height;overlay.getContext('2d').lineTo(x,y);overlay.getContext('2d').stroke()};const up=()=>{overlay.removeEventListener('pointermove',move);overlay.removeEventListener('pointerup',up)};overlay.addEventListener('pointermove',move);overlay.addEventListener('pointerup',up)});wrap.addEventListener('click',()=>state.active=state.pages.indexOf(state.pages.find(x=>x.overlay===overlay)))}$('addText').disabled=false;$('draw').disabled=false;$('save').disabled=false;$('clear').disabled=false;status(`${pdf.numPages} صفحة جاهزة للتعديل.`)}
$('pdfInput').onchange=async e=>{const f=e.target.files[0];if(f)render(new Uint8Array(await f.arrayBuffer()))};async function imagePick(e){const f=e.target.files[0];if(!f)return;status('جاري تحويل الصورة/المسح إلى PDF...');render(await imageToPdf(f))}$('cameraInput').onchange=imagePick;$('imageInput').onchange=imagePick;
$('draw').onclick=()=>{state.draw=!state.draw;$('draw').textContent=state.draw?'إيقاف الرسم':'الرسم على الصفحة';status(state.draw?'الرسم مفعل: اسحب بإصبعك أو الفأرة على الصفحة.':'تم إيقاف الرسم.')};
$('addText').onclick=()=>{if(!state.pages.length)return;const i=state.active??0;const text=prompt('اكتب النص الذي تريد إضافته:');if(!text)return;const o=state.pages[i].overlay,c=o.getContext('2d');c.fillStyle='#111827';c.font='24px Arial';c.fillText(text,40,60);state.active=i};
$('clear').onclick=()=>state.pages.forEach(p=>p.overlay.getContext('2d').clearRect(0,0,p.overlay.width,p.overlay.height));
$('save').onclick=async()=>{try{status('جاري حفظ التعديلات...');const pdf=await PDFLib.PDFDocument.load(state.pdfBytes);for(let i=0;i<state.pages.length;i++){const o=state.pages[i].overlay;if(o.getContext('2d').getImageData(0,0,o.width,o.height).data.some((v,j)=>j%4===3&&v>0)){const png=await pdf.embedPng(o.toDataURL('image/png'));const p=pdf.getPages()[i],sx=p.getWidth()/o.width,sy=p.getHeight()/o.height;p.drawImage(png,{x:0,y:0,width:p.getWidth(),height:p.getHeight()})}}const out=await pdf.save({useObjectStreams:true});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));a.download='wpdf-edited.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status('تم الحفظ والتحميل بنجاح ✓')}catch(e){console.error(e);status('تعذر حفظ الملف: '+e.message)}};
</script></body></html>
